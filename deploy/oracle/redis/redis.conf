# OpenReply Redis on the Oracle VM.
# 6379: plain, published only on the VM's 127.0.0.1 (worker on the same VM).
# 6380: TLS, published to the internet (Vercel webhooks and dashboard).

bind 0.0.0.0
protected-mode no
port 6379

tls-port 6380
tls-cert-file /tls/fullchain.pem
tls-key-file /tls/privkey.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

# Access is controlled by ACL users; the default user is disabled there.
aclfile /usr/local/etc/redis/users.acl

# BullMQ requires that Redis never evicts keys.
maxmemory 256mb
maxmemory-policy noeviction

# Persist the queue so a restart does not lose jobs.
appendonly yes
appendfsync everysec
dir /data

timeout 0
tcp-keepalive 60
